{% extends 'shop/base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white border border-gray-100 rounded-3xl p-8 shadow-sm space-y-6">
        <h2 class="text-xl font-black text-gray-900 uppercase tracking-tight text-center">Вход в аккаунт</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-50 text-red-600 text-xs p-3 rounded-xl text-center font-bold">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <input type="text" name="username" placeholder="Логин" required
                       class="w-full bg-gray-50 border border-gray-200 text-xs px-4 py-3 rounded-xl focus:outline-none focus:border-blue-700">
            </div>
            <div>
                <input type="password" name="password" placeholder="Пароль" required
                       class="w-full bg-gray-50 border border-gray-200 text-xs px-4 py-3 rounded-xl focus:outline-none focus:border-blue-700">
            </div>
            <button type="submit" class="w-full bg-blue-700 text-white font-bold text-xs uppercase tracking-wider py-4 rounded-2xl hover:bg-blue-800 transition shadow-md">
                Войти
            </button>
        </form>
        <p class="text-center text-xs text-gray-400">
            Нет аккаунта? <a href="{% url 'shop:register' %}" class="text-blue-700 font-bold underline">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
